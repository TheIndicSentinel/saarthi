name: CI (PR checks)

# Fast pull-request gate: unit tests + lint only, no APK/AAB build or
# artifact publishing (that's build_apk.yml's job on push to main, and
# release_aab.yml's job on a version tag). Attach this job as the required
# status check on main ("test-and-lint") so a PR cannot merge red.

on:
  pull_request:
    branches: [ main, master ]

# Cancel an in-flight run when a newer commit is pushed to the same PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Write local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME"                     > local.properties
          echo "hf.app.token=${{ secrets.HF_APP_TOKEN }}" >> local.properties

      # testDebugUnitTest only — see build_apk.yml's comment: `test` also
      # builds+runs the RELEASE unit-test variant for zero extra coverage.
      - name: Run unit tests
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest 2>&1 | tee /tmp/test.log
          EXIT_CODE=${PIPESTATUS[0]}
          if [ $EXIT_CODE -ne 0 ]; then
            echo "::group::Test failure summary (last 80 lines)"
            tail -80 /tmp/test.log
            echo "::endgroup::"
          fi
          exit $EXIT_CODE

      - name: Upload test report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: pr-test-report
          path: "**/build/reports/tests/"
          retention-days: 2

      - name: Run Android Lint
        run: |
          chmod +x gradlew
          ./gradlew lintDebug --stacktrace

      - name: Upload lint report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: pr-lint-report
          path: "**/build/reports/lint-results-debug.html"
          retention-days: 2
